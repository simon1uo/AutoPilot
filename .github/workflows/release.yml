name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0" 2>&1 | tail -3 || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./app/gradlew

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release (secrets present)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ./app
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDirectRelease assembleDirectDebug --no-daemon --stacktrace

      - name: Build unsigned release (no secrets)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: ./app
        run: ./gradlew assembleDirectRelease assembleDirectDebug --no-daemon --stacktrace

      - name: Verify signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          APK=$(ls app/app/build/outputs/apk/direct/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Rename artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          REL=$(ls app/app/build/outputs/apk/direct/release/*.apk | head -1)
          DBG=$(ls app/app/build/outputs/apk/direct/debug/*.apk | head -1)
          if echo "$REL" | grep -q unsigned; then
            cp "$REL" "out/AutoPilot-${TAG}-release-unsigned.apk"
          else
            cp "$REL" "out/AutoPilot-${TAG}-release.apk"
          fi
          cp "$DBG" "out/AutoPilot-${TAG}-debug.apk"
          ls -la out/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" 'index($0,"## ["ver"]")==1 {flag=1; next} flag && index($0,"## [")==1 {flag=0} flag {print}' CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > release_notes.md; fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AutoPilot ${{ github.ref_name }}
          body_path: release_notes.md
          files: out/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./app/gradlew

      - name: Build release + debug APK
        working-directory: ./app
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          find app/app/build/outputs/apk -name "*.apk" | while read f; do
            base=$(basename "$f")
            case "$base" in
              *debug*)   cp "$f" "out/AutoPilot-${TAG}-debug.apk" ;;
              *release*) cp "$f" "out/AutoPilot-${TAG}-release-unsigned.apk" ;;
            esac
          done
          ls -la out/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" 'index($0,"## ["ver"]")==1 {flag=1; next} flag && index($0,"## [")==1 {flag=0} flag {print}' CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > release_notes.md; fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AutoPilot ${{ github.ref_name }}
          body_path: release_notes.md
          files: out/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}